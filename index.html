<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width", initial-scale="1.0">

        <link rel="stylesheet" href="results.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

        <title>Frontend Mentor | Results summary component</title>
    </head>
    <body>
        <main class="results-card">
            <div class="results-card__header">
                <h1 class="results-card__header-title">Your Result</h1>
                <div class="results-card__score">
                    <span class="results-card__score-value">76</span>
                    <span class="results-card__score-max">of 100</span>
                </div>
                <p class="results-card__score-text">Great</p>
                <p class="results-card__score-description">You scored higher than 65% of the people who have taken these tests.</p>
            </div>
            <div class="results-card__summary"> 
                <h2 class="results-card__summary-title">Summary</h2>
                <div class="summary-row reaction">
  <span class="row-label">
    <img class="summary-icon" src="icon-reaction.svg" alt="Reaction icon">
    Reaction
  </span>
  <span class="row-score"><strong>80</strong> / 100</span>
</div>

<div class="summary-row memory">
  <span class="row-label">
    <img class="summary-icon" src="icon-memory.svg" alt="Memory icon">
    Memory
  </span>
  <span class="row-score"><strong>92</strong> / 100</span>
</div>

<div class="summary-row verbal">
  <span class="row-label">
    <img class="summary-icon" src="icon-verbal.svg" alt="Verbal icon">
    Verbal
  </span>
  <span class="row-score"><strong>61</strong> / 100</span>
</div>

<div class="summary-row visual">
  <span class="row-label">
    <img class="summary-icon" src="icon-visual.svg" alt="Visual icon">
    Visual
  </span>
  <span class="row-score"><strong>73</strong> / 100</span>
</div>
                <button class="results-card__continue-button">Continue</button> 
        </main>
    </body>




    
</html>
